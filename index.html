<body>
<header>飲み会精算</header>
<main>
<h1>一次会と二次会の割り勘・立替精算</h1>
<p class="lead">会計ごとに参加者を選ぶと、最後に誰が誰へいくら払うか分かります。</p>
<div class="panel">
<form id="tool">
<label>参加者（1行に1人）<textarea id="people">葵
蓮
凛
湊
澪</textarea></label><div id="bills"></div><button type="button" id="add">会計を追加</button>
<div class="actions"><button class="primary" type="submit">最終精算を計算</button><button type="button" id="copy" disabled>結果をコピー</button></div>
</form>
<output id="result" aria-live="polite"></output>
<p id="notice" role="status"></p>
</div>
<section class="guide">
<h2>使い方と計算・入力のルール</h2>
<p>各会計はその会計の参加者だけで均等に負担します。割り切れない1円は、参加者リストの上から順に加算します。立替者はその会計の参加者に含まれなくても設定できます。</p>
</section>
</main>
<footer>入力内容はブラウザ内で処理し、このページから外部に送信しません。</footer>
<script>
'use strict';
const form = document.querySelector('#tool');
const result = document.querySelector('#result');
const copy = document.querySelector('#copy');
const status = document.querySelector('#notice');
const people = document.querySelector('#people');
const bills = document.querySelector('#bills');
const add = document.querySelector('#add');
const names = () => people.value.split(/\n/).map(name => name.trim()).filter(Boolean);
function refreshChoices() {
  const options = [...new Set(names())];
  for (const row of bills.children) {
    const payer = row.querySelector('select');
    const previousPayer = payer.value;
    payer.replaceChildren(...options.map(name => new Option(name, name)));
    if (options.includes(previousPayer)) payer.value = previousPayer;
    const checks = row.querySelector('.checks');
    const saved = new Map([...checks.querySelectorAll('input')].map(input => [input.value, input.checked]));
    checks.replaceChildren(...options.map(name => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.value = name;
      input.checked = saved.get(name) ?? true;
      label.append(input, name);
      return label;
    }));
  }
}
function addBill(amount = '', payer = '', attendees) {
  const row = document.createElement('fieldset');
  row.innerHTML = '<legend>会計</legend><div class="fields"><label>金額（円）<input class="amount" type="number" min="1" max="10000000" step="1" required></label><label>立替者<select required></select></label></div><p>この会計に参加した人</p><div class="checks"></div><button type="button" class="remove">この会計を削除</button>';
  row.querySelector('.amount').value = amount;
  row.querySelector('.remove').addEventListener('click', () => {
    row.remove();
    result.textContent = '変更しました。もう一度計算してください。';
  });
  bills.append(row);
  refreshChoices();
  if (payer) row.querySelector('select').value = payer;
  if (attendees) for (const input of row.querySelectorAll('.checks input')) input.checked = attendees.includes(input.value);
}
people.addEventListener('input', refreshChoices);
add.addEventListener('click', () => addBill());
addBill(12000, '葵');
addBill(5400, '蓮', ['葵', '蓮', '凛']);
function calculate() {
  const members = names();
  if (members.length < 2 || new Set(members).size !== members.length) throw Error('異なる名前を2人以上入力してください。');
  if (!bills.children.length) throw Error('会計を1件以上追加してください。');
  const balances = new Map(members.map(name => [name, 0]));
  for (const [index, row] of [...bills.children].entries()) {
    const amount = row.querySelector('.amount').valueAsNumber;
    const payer = row.querySelector('select').value;
    const attendees = [...row.querySelectorAll('input:checked')].map(input => input.value);
    if (!attendees.length) throw Error('会計' + (index + 1) + 'の参加者を選んでください。');
    const base = Math.floor(amount / attendees.length);
    const remainder = amount % attendees.length;
    balances.set(payer, balances.get(payer) + amount);
    attendees.forEach((name, i) => balances.set(name, balances.get(name) - base - Number(i < remainder)));
  }
  const debtors = [...balances].filter(([, amount]) => amount < 0);
  const creditors = [...balances].filter(([, amount]) => amount > 0);
  const payments = [];
  let receiver = 0;
  for (const [name, balance] of debtors) {
    let remaining = -balance;
    while (remaining > 0) {
      const [recipient, due] = creditors[receiver];
      const payment = Math.min(remaining, due);
      payments.push(name + ' → ' + recipient + '　' + payment.toLocaleString('ja-JP') + '円');
      remaining -= payment;
      creditors[receiver][1] -= payment;
      if (creditors[receiver][1] === 0) receiver += 1;
    }
  }
  return payments.length ? payments.join('\n') : '追加の支払いはありません。';
}

form.addEventListener('submit', event => {
  event.preventDefault();
  try {
    result.textContent = calculate();
    copy.disabled = false;
  } catch (error) {
    result.textContent = error.message;
    copy.disabled = true;
  }
  status.textContent = '';
});
function clearResult() {
  result.textContent = '';
  status.textContent = '';
  copy.disabled = true;
}
form.addEventListener('input', clearResult);
form.addEventListener('click', event => {
  if (event.target.matches('#add, .remove')) clearResult();
});
copy.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(result.textContent);
    status.textContent = 'コピーしました。';
  } catch {
    status.textContent = 'コピーできない場合は、結果を選択してコピーしてください。';
  }
});

</script>
</body>
</html>
